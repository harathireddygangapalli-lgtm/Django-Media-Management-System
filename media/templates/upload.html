<!DOCTYPE html>
<html>
<head>
    <title>Media Upload</title>
</head>
<body>

    <h1>Upload Media</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Title:</label>
        <input type="text" name="title" required>

        <br><br>

        <label>Select File:</label>
        <input type="file" name="file" required>

        <br><br>

        <button type="submit">Upload</button>
    </form>

</body>
</html>
