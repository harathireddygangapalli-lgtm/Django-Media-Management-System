<!DOCTYPE html>
<html>
<head>
    <title>Media Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .upload-link {
            display: block;
            width: fit-content;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            border-radius: 8px;
        }

        .card h3 {
            margin: 15px 0;
        }

        .buttons {
            margin-top: 15px;
        }

        .buttons a {
            display: inline-block;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
        }

        .open-btn {
            background-color: #007bff;
        }

        .delete-btn {
            background-color: #dc3545;
        }
    </style>
</head>

<body>

    <h1>Media Gallery</h1>

    <a class="upload-link" href="/upload/">
        + Upload New Media
    </a>

    <div class="gallery">

        {% for media in media_files %}

        <div class="card">

            <h3>{{ media.title }}</h3>

            <img src="{{ media.file.url }}" alt="{{ media.title }}">

            <div class="buttons">

                <a class="open-btn"
                   href="{{ media.file.url }}"
                   target="_blank">
                    Open File
                </a>

                <a class="delete-btn"
                   href="{% url 'delete_media' media.id %}">
                    Delete
                </a>

            </div>

        </div>

        {% empty %}

        <p>No media uploaded yet.</p>

        {% endfor %}

    </div>

</body>
</html>
